version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: verticare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-verticare_db}
      POSTGRES_USER: ${POSTGRES_USER:-verticare_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verticare_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verticare_user} -d ${POSTGRES_DB:-verticare_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - verticare_network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: verticare_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-verticare_user}:${POSTGRES_PASSWORD:-verticare_password}@postgres:5432/${POSTGRES_DB:-verticare_db}
      SECRET_KEY: ${SECRET_KEY:-verticare_production_super_secret_key_2026_change_in_prod}
      ENVIRONMENT: production
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - verticare_network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: verticare_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - verticare_network

networks:
  verticare_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

